<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Birthdayth preview</title>
  <desc id="description">Pastel birthday letter illustration with flowers, envelope and birthday cake.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5f7"/>
      <stop offset="1" stop-color="#ffe4ea"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#d47a8d" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="36" fill="url(#background)"/>
  <circle cx="130" cy="112" r="72" fill="#ffb6c1" opacity=".22"/>
  <circle cx="1080" cy="500" r="120" fill="#ff8e9e" opacity=".14"/>
  <g fill="#e85d75" opacity=".6">
    <path d="M170 220c-18-35 22-62 38-25 16-37 56-10 38 25-18 35-38 48-38 48s-20-13-38-48Z"/>
    <path d="M980 150c-14-28 18-50 30-20 13-30 45-8 30 20-14 28-30 38-30 38s-16-10-30-38Z"/>
  </g>
  <text x="600" y="106" text-anchor="middle" fill="#e85d75" font-family="Georgia, serif" font-size="54" font-weight="700">Happy Birthday</text>
  <text x="600" y="148" text-anchor="middle" fill="#827479" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">A LITTLE LETTER MADE WITH LOVE</text>
  <g filter="url(#shadow)">
    <rect x="260" y="214" width="680" height="270" rx="30" fill="url(#envelope)" stroke="#ffffff" stroke-width="8"/>
    <path d="M270 236 600 430 930 236" fill="#ffe4ea" stroke="#ffb6c1" stroke-width="5"/>
    <path d="M270 466 490 315M930 466 710 315" fill="none" stroke="#ffb6c1" stroke-width="5"/>
    <rect x="458" y="260" width="284" height="156" rx="18" fill="#fff" stroke="#ffb6c1" stroke-width="4"/>
    <text x="600" y="312" text-anchor="middle" fill="#e85d75" font-family="Georgia, serif" font-size="25">Chúc mừng sinh nhật!</text>
    <text x="600" y="350" text-anchor="middle" fill="#827479" font-family="Arial, sans-serif" font-size="18">Mở thư để đọc lời chúc</text>
    <circle cx="600" cy="430" r="34" fill="#a4161a"/>
    <text x="600" y="441" text-anchor="middle" fill="#fff" font-size="27">♡</text>
  </g>
  <g transform="translate(94 450)">
    <rect x="0" y="42" width="120" height="64" rx="14" fill="#ffb6c1"/>
    <rect x="15" y="18" width="90" height="38" rx="12" fill="#fff" stroke="#e85d75" stroke-width="4"/>
    <path d="M28 18v-28M60 18v-38M92 18v-28" stroke="#827479" stroke-width="7" stroke-linecap="round"/>
    <path d="M28-31c-15-20 12-28 0-43M60-51c-15-20 12-28 0-43M92-31c-15-20 12-28 0-43" fill="none" stroke="#ff8e9e" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="#ff8e9e" opacity=".55">
    <circle cx="1030" cy="270" r="9"/>
    <circle cx="1080" cy="230" r="6"/>
    <circle cx="1000" cy="320" r="5"/>
    <circle cx="185" cy="370" r="7"/>
    <circle cx="120" cy="320" r="5"/>
  </g>
</svg>
